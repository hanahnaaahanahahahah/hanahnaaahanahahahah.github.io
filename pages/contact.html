<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Contato</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <header>
        <h1>Reclame aqui</h1>
        <hr>

<br>


        <section>
            <form action="#" method="POST">

                <div>
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome se possível" required
                        autocomplete="name">
                </div>
<br>
                <div>
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="exemplo@upf.br" required
                        autocomplete="email">
                </div>
<br>

                <div>
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" pattern="[0-9()-\s]*">
                </div>
<br>

                <div>
                    <label for="assunto">Assunto</label>
                    <select id="assunto" name="assunto" required>
                        <option value="" disabled selected>Selecione uma opção...</option>
                        <option value="quero-chorar">Meu código não funciona e eu quero chorar</option>
                        <option value="socorro">Minha mãe quer me bater, o que eu faço</option>
                        <option value="suporte">Não preciso de suporte</option>
                        <option value="perdido">Socorro não sei usar o VS Code</option>
                        <option value="outros">Outros motivos que não quero explicar</option>
                    </select>
                </div>
<br>

                <div>
                    <label for="mensagem">Sua Mensagem</label>
                    <textarea id="mensagem" name="mensagem" placeholder="Escreva o que quiser" required></textarea>
                </div>
<br>

                <div>
                    <button type="submit">Enviar</button>
                </div>
<br>

            </form>
        </section>
    </header>

    <script src="../js/script.js" defer></script>
</body>

</html>
